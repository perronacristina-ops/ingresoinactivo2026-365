<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Configuración de la imagen de fondo */
            background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80'); /* Reemplaza con el enlace o nombre de tu imagen */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            color: #333;
        }

        /* Capa oscura opcional para que el texto resalte mejor sobre la imagen */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Cambia el 0.5 si quieres más oscuro (1) o más claro (0) */
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2; /* Asegura que la caja esté por encima de la capa oscura */
            text-align: center;
            background: rgba(255, 255, 255, 0.95); /* Fondo blanco ligeramente translúcido */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            font-size: 1.2rem;
            color: #444;
            margin-bottom: 20px;
        }
        .countdown {
            font-size: 3.5rem;
            font-weight: bold;
            color: #007bff;
            margin: 15px 0;
        }
        .spinner {
            margin: 20px auto 0;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>En breve te redirigimos a nuestra página oficial.</h2>
        <div class="countdown" id="reloj">2</div>
        <div class="spinner"></div>
    </div>

    <script>
        // Configura la URL de destino aquí
        const urlDestino = "https://ingresoinactivo2026ww.hstn.me/"; 
        
        // Tiempo en segundos
        let segundosRestantes = 2;
        
        const relojElemento = document.getElementById("reloj");

        const intervalo = setInterval(() => {
            segundosRestantes--;
            relojElemento.textContent = segundosRestantes;

            if (segundosRestantes <= 0) {
                clearInterval(intervalo);
                window.location.href = urlDestino;
            }
        }, 1000);
    </script>

</body>
</html>
